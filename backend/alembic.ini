# Alembic configuration for the AI Ops Log Analyzer backend.
#
# Schema is managed as forward-only, sequentially numbered migrations
# (see Requirements 11.1, 11.3, 11.6). The database URL is intentionally left
# blank here: migrations/env.py resolves it at runtime from the typed
# application config / environment so secrets never live in source control
# (see coding-standards.md §11.2 and Requirement 11).

[alembic]
# Location of the migration environment and version scripts, relative to the
# directory that contains this file (backend/).
script_location = migrations

# Template used to generate new migration filenames. The leading revision id
# keeps files sorted and human-readable (e.g. 0001_create_analysis_record.py).
truncate_slug_length = 40

# Resolved at runtime in migrations/env.py from DATABASE_URL / app config.
# Left blank on purpose to avoid storing credentials in version control.
sqlalchemy.url =

[post_write_hooks]
# No automatic formatting hooks configured.

# --- Logging configuration (standard Alembic logging setup) ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
