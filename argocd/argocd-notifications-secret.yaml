apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # URL of the AI Ops backend service.
  # Replace with the actual service address:
  #   - In-cluster:     http://ai-ops-backend.ai-ops.svc.cluster.local:8000
  #   - External/local: http://<host-ip>:8000
  ai-ops-backend-url: http://ai-ops-backend.ai-ops.svc.cluster.local:8000
